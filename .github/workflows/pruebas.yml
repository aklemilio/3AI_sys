# Pruebas automáticas: corren en cada PR y en cada push a main.
# Sin red ni claves: las pruebas usan solo los datos de fixtures/.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Como en el PC: solo las dependencias de pyproject.toml; tresia se importa
      # desde la carpeta (pythonpath = ["."] en pytest), sin instalar el paquete.
      - name: Instalar las dependencias y pytest
        run: |
          python -c "import tomllib; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; open('requisitos-ci.txt', 'w').write('\n'.join(p['dependencies'] + p['optional-dependencies']['dev']))"
          python -m pip install -r requisitos-ci.txt
      - name: Correr las pruebas
        run: python -m pytest -q
